<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="A small number of drugs account for half of spending"><rect width="960" height="500" fill="#fafbfc"/><text x="48" y="45" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#152337">A small number of drugs account for half of spending</text><text x="48" y="72" font-family="Arial,sans-serif" font-size="15" fill="#66788a">2024 spending concentration (~38 of 3,625 drug-level products)</text><text x="135" y="165" font-family="Arial,sans-serif" font-size="21" text-anchor="start" fill="#173a5e" font-weight="bold">Top 38 drugs</text><text x="135" y="195" font-family="Arial,sans-serif" font-size="17" text-anchor="start" fill="#344356" font-weight="normal">~1% of drugs</text><rect x="135" y="235" width="332" height="97" rx="8" fill="#2674c3"/><text x="301" y="291" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="bold">~50% spending</text><text x="545" y="165" font-family="Arial,sans-serif" font-size="21" text-anchor="start" fill="#173a5e" font-weight="bold">All other drugs</text><text x="545" y="195" font-family="Arial,sans-serif" font-size="17" text-anchor="start" fill="#344356" font-weight="normal">~99% of drugs</text><rect x="545" y="235" width="332" height="97" rx="8" fill="#7b9fc1"/><text x="711" y="291" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="bold">~50% spending</text><text x="135" y="396" font-family="Arial,sans-serif" font-size="15" text-anchor="start" fill="#344356" font-weight="normal">Approximate concentration summary from the project analysis; not a full Lorenz curve.</text><text x="48" y="482" font-family="Arial,sans-serif" font-size="12" fill="#708090">Source: CMS Medicare Part D Spending by Drug, gross spending before rebates, 2020–2024</text></svg>